name: Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, an das die Pakete angehängt werden (leer = nur Artefakte, kein Release-Upload)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/scanner.spec --distpath dist --workpath build --noconfirm
      - name: Version ermitteln und portable .exe versionieren
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from scanner_app import __version__; print(__version__)")
          NAME="Scanner-${VERSION}-windows-x86_64.exe"
          cp dist/Scanner.exe "dist/$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exe_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "setup_name=Scanner-${VERSION}-windows-x86_64-setup.exe" >> "$GITHUB_OUTPUT"
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Installer bauen
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging\scanner.iss
      - name: SHA-256-Prüfsummen erzeugen
        # Wird vom automatischen Windows-Update (windows_updater.py) genutzt, um den
        # heruntergeladenen Installer vor der stillen Ausführung zu verifizieren — ohne
        # diese Sidecar-Dateien bliebe Auto-Update auf reines "Hinweis + Link" beschränkt.
        shell: bash
        run: |
          cd dist
          sha256sum "${{ steps.version.outputs.exe_name }}" > "${{ steps.version.outputs.exe_name }}.sha256"
          sha256sum "installer/${{ steps.version.outputs.setup_name }}" > "installer/${{ steps.version.outputs.setup_name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-windows-exe
          path: |
            dist/${{ steps.version.outputs.exe_name }}
            dist/${{ steps.version.outputs.exe_name }}.sha256
            dist/installer/${{ steps.version.outputs.setup_name }}
            dist/installer/${{ steps.version.outputs.setup_name }}.sha256
      - name: An Release anhängen
        if: ${{ github.event.inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            "dist/installer/${{ steps.version.outputs.setup_name }}#Windows 10/11 (64-bit) – Installer (empfohlen: Startmenü-Eintrag, sauberes Deinstallieren über Windows-Einstellungen)" \
            "dist/installer/${{ steps.version.outputs.setup_name }}.sha256#SHA-256-Prüfsumme des Installers (für automatische Updates und manuelle Verifikation)" \
            "dist/${{ steps.version.outputs.exe_name }}#Windows 10/11 (64-bit) – portable, ohne Installation direkt startbar" \
            "dist/${{ steps.version.outputs.exe_name }}.sha256#SHA-256-Prüfsumme der portablen .exe" \
            --clobber --repo "${{ github.repository }}"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsane-dev sane-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng \
            qpdf ghostscript libegl1 libgl1 libxkbcommon0 libdbus-1-3 ruby rpm patchelf
      - run: pip install -e ".[build]"
      - name: fpm installieren
        run: sudo gem install fpm --no-document
      - name: appimagetool installieren
        run: |
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Version ermitteln
        id: version
        run: echo "version=$(python3 -c 'from scanner_app import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-linux-packages
          path: dist/packages/*
      - name: An Release anhängen
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            "dist/packages/scanner_${V}_amd64.deb#Linux – Debian/Ubuntu (.deb)" \
            "dist/packages/scanner-${V}-1.x86_64.rpm#Linux – Fedora/RHEL/openSUSE (.rpm)" \
            "dist/packages/Scanner-${V}-x86_64.AppImage#Linux – universell, portabel (AppImage: chmod +x, dann ausführen)" \
            "dist/packages/scanner-${V}-linux-x86_64.tar.gz#Linux – portables Archiv zum manuellen Entpacken (.tar.gz)" \
            --clobber --repo "${{ github.repository }}"

  annotate-release:
    needs: [windows, linux]
    if: ${{ github.event.inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body > body.md
          if ! grep -q "## Downloads" body.md; then
            cat >> body.md <<'EOF'

          ## Downloads

          | Datei | Für |
          |---|---|
          | `Scanner-*-windows-x86_64-setup.exe` | Windows 10/11 (64-bit) — Installer (empfohlen: Startmenü-Eintrag, sauberes Deinstallieren) |
          | `Scanner-*-windows-x86_64.exe` | Windows 10/11 (64-bit) — portable, ohne Installation direkt startbar |
          | `Scanner-*-x86_64.AppImage` | Linux, universell — `chmod +x`, dann ausführen |
          | `scanner_*_amd64.deb` | Linux — Debian, Ubuntu und Derivate |
          | `scanner-*-1.x86_64.rpm` | Linux — Fedora, RHEL, openSUSE und Derivate |
          | `scanner-*-linux-x86_64.tar.gz` | Linux — portables Archiv zum manuellen Entpacken |
          EOF
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file body.md
          fi

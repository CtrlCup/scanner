name: Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, an das die Pakete angehängt werden (leer = nur Artefakte, kein Release-Upload)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/scanner.spec --distpath dist --workpath build --noconfirm
      - name: Zip Windows-Bundle
        shell: pwsh
        run: Compress-Archive -Path dist/Scanner/* -DestinationPath dist/Scanner-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-windows-exe
          path: dist/Scanner-windows-x86_64.zip
      - name: An Release anhängen
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag }}" dist/Scanner-windows-x86_64.zip --clobber --repo ${{ github.repository }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsane-dev sane-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng \
            qpdf ghostscript libegl1 libgl1 libxkbcommon0 libdbus-1-3 ruby rpm patchelf
      - run: pip install -e ".[build]"
      - name: fpm installieren
        run: sudo gem install fpm --no-document
      - name: appimagetool installieren
        run: |
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-linux-packages
          path: dist/packages/*
      - name: An Release anhängen
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag }}" dist/packages/* --clobber --repo ${{ github.repository }}

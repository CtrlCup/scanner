name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.repository_owner == 'CtrlCup'
    runs-on: ubuntu-latest
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-semantic-release
      - run: semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package-Workflow für neue Version anstoßen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ein von GITHUB_TOKEN gepushter Tag löst laut GitHub selbst keine weiteren
          # Workflow-Runs aus (Rekursionsschutz) — daher hier explizit dispatchen.
          if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "Neuer Tag: $TAG — löse Package-Workflow aus"
            gh workflow run package.yml --ref main -f tag="$TAG"
          else
            echo "Kein neuer Tag auf HEAD — kein Release, Package-Workflow wird nicht ausgelöst"
          fi
